id: oppg1
title: 'Oppgave 1-trening: hemmeligheter og lekkasjer'
short: Oppgave 1
kind: temasett
order: 0
featured: Foreleserens hint
blurb: '**Prioriter denne.** Foreleser sier at oppgave 1 på H26 bygger på Oblig 2a oppg. 8 og Oblig 3a oppg. 7. Her er obligoppgavene med løsningsforslag, tre nye varianter og flervalg om samme tema.'
duration_min: 240
note: |
  Foreleser har sagt at **oppgave 1 på eksamen H26 bygger på tematikken fra oppgave 8 i Oblig 2a og oppgave 7 i Oblig 3a**, altså sannsynligheten for at en hemmelighet holdes når mange kjenner den (Grimes, 2016).

  Settet har fire deler:
  1. Obligoppgavene, med fullstendige løsningsforslag.
  2. Tre nye varianter i eksamensformat (a, b, c …) som kobler temaet til binomisk og Poisson, eksponentialfordeling, konfidensintervall, test og MLE, slik eksamensoppgaver pleier.
  3. Flervalg om samme tema.

  Alle tall i variantene er oppdiktet.

sections:
  - title: Oblig 2a, oppgave 8 · Sannsynlighetsbegrepet i praksis
    intro: |
      Virkeligheten er sjelden like ryddig som i læreboka. I media hører man ofte at noe er «helt sikkert» eller «helt utrolig», altså vurderinger av sannsynlighet som ofte er løsrevet fra faktiske analyser.

      I Grimes (2016) anslås sannsynligheten for en lekkasje i konspirasjoner med mange involverte til
      $$p\approx 4\cdot 10^{-6}\ \text{per person per år}.$$
      Med lekkasje menes at avslørende informasjon kommer på avveie, *ikke* nødvendigvis at konspirasjonen blir avslørt.
    tasks:
      - id: O2-8
        label: Oblig 2a, 8
        type: langsvar
        points: 5
        topics: [sannsynlighet]
        prompt: |
          Beskriv med egne ord (20–100 ord) hvordan denne $p$-en passer med sannsynlighetsbegrepet i STAT110.

          *Hint: Tenk utfallsrom og eksperiment.*
        solution: |
          Det finnes ingen enkelt fasit. Et godt svar har med noe av dette:

          - **Eksperimentet** er «én person som kjenner hemmeligheten, i ett år». **Utfallsrommet** er $\Omega=\{\text{lekker},\ \text{lekker ikke}\}$, og $p=P(\text{lekker})$.
          - **Frekvenstolkning:** Hvis vi observerer svært mange person-år, vil andelen person-år med lekkasje nærme seg $p$ (jf. store talls lov). $p\approx4\cdot10^{-6}$ betyr omtrent 4 lekkasjer per million person-år.
          - $p$ er et *estimat* basert på noen få historiske tilfeller, så det er usikkert. Modellen antar at alle personer og år har samme $p$ og er **uavhengige**, noe som er en sterk forenkling.
          - $p$ gjelder per person per år. Sannsynligheten for at *hele konspirasjonen* lekker er noe annet og avhenger av antall personer og tid.
        rubric:
          - [2, 'Identifiserer eksperiment (person-år) og utfallsrom (lekker / lekker ikke)']
          - [2, 'Frekvenstolkning: relativ frekvens over mange person-år']
          - [1, 'Kommenterer usikkerhet og antakelser (estimat, uavhengighet, lik $p$)']

  - title: Oblig 3a, oppgave 7 · Hvor lenge kan en hemmelighet forbli hemmelig?
    intro: |
      I Grimes (2016) anslås sannsynligheten for en lekkasje i konspirasjoner med mange involverte til $p\approx 4\cdot10^{-6}$ per person per år. Med lekkasje menes at avslørende informasjon er på avveie, ikke nødvendigvis at konspirasjonen er avslørt.

      Anta at en konspirasjon har $N$ individer, og at hvert individ i løpet av et år lekker eller ikke lekker, uavhengig av de andre, med sannsynlighet $p$ for lekkasje. Anta også at ulike år er uavhengige.
    tasks:
      - id: O3-7a
        label: Oblig 3a, 7(a)
        type: langsvar
        points: 10
        topics: [sannsynlighet, diskrete]
        prompt: |
          Vis at sannsynligheten for at det ikke skjer noen lekkasje i løpet av ett år er $(1-p)^N$. Beregn denne sannsynligheten for både $N=30\,000$ og $N=400$ når $p=4\cdot10^{-6}$.

          Forklar deretter hvorfor sannsynligheten for at hemmeligheten fortsatt holder etter $t$ år er
          $$S(t)=(1-p)^{Nt}.$$
          Bruk at $1-p\approx e^{-p}$ når $p$ er liten, til å vise at $S(t)\approx e^{-Npt}$.
        solution: |
          La $A_i$ = «person $i$ lekker ikke i løpet av året», med $P(A_i)=1-p$. Ingen lekkasje betyr at alle $A_i$ inntreffer. Siden personene er uavhengige, gir produktsetningen
          $$P(\text{ingen lekkasje på ett år}) = P(A_1\cap\cdots\cap A_N)=\prod_{i=1}^N P(A_i)=(1-p)^N.$$
          - $N=30\,000$: $(1-4\cdot10^{-6})^{30000}\approx 0.887$
          - $N=400$: $(1-4\cdot10^{-6})^{400}\approx 0.998$

          Hemmeligheten holder i $t$ år hvis det ikke er lekkasje i år 1, år 2, …, år $t$. Årene er uavhengige, så
          $$S(t)=\big[(1-p)^N\big]^t=(1-p)^{Nt}.$$
          (Det er det samme som at ingen av de $Nt$ uavhengige person-årene gir lekkasje.)

          Med $1-p\approx e^{-p}$ blir $S(t)=(1-p)^{Nt}\approx (e^{-p})^{Nt}=e^{-Npt}$.
        rubric:
          - [3, 'Uavhengighet og produktsetning gir $(1-p)^N$']
          - [2, 'Riktige tall: ca. $0.887$ og $0.998$']
          - [3, 'Forklarer $S(t)=(1-p)^{Nt}$ med uavhengighet mellom år']
          - [2, 'Viser tilnærmingen $S(t)\approx e^{-Npt}$']

      - id: O3-7b
        label: Oblig 3a, 7(b)
        type: langsvar
        points: 10
        topics: [sannsynlighet, poisson-eksp]
        prompt: |
          Bruk tilnærmingen $S(t)\approx e^{-Npt}$ med $p=4\cdot10^{-6}$ i situasjonene under.

          **(i)** Beregn $S(t)$ for en stor gruppe med $N=30\,000$ individer over $t=6$ år, og for en liten gruppe med $N=400$ individer over $t=25$ år.

          **(ii)** For både $N=400$ og $N=30\,000$: bestem antall år $t$ slik at sannsynligheten for lekkasje (innen $t$ år) er minst $1/2$.

          **(iii)** Hva må $N$ være for at det med sannsynlighet $0.95$ ikke inntreffer en lekkasje innen $t=25$ år?
        solution: |
          **(i)**
          - $N=30\,000$, $t=6$: $Npt=30000\cdot4\cdot10^{-6}\cdot6=0.72$, så $S(6)\approx e^{-0.72}\approx 0.487$.
          - $N=400$, $t=25$: $Npt=0.04$, så $S(25)\approx e^{-0.04}\approx 0.961$.

          **(ii)** Lekkasje innen $t$ år har sannsynlighet $1-S(t)$. Vi vil ha $1-S(t)\ge \tfrac12$, altså $e^{-Npt}\le\tfrac12$:
          $$t\ \ge\ \frac{\ln 2}{Np}.$$
          - $N=400$: $t\ge \dfrac{0.693}{0.0016}\approx 433$ år
          - $N=30\,000$: $t\ge \dfrac{0.693}{0.12}\approx 5.8$ år

          **(iii)** Vi vil ha $e^{-Np\cdot25}\ge 0.95$, altså $N\le \dfrac{-\ln 0.95}{25p}=\dfrac{0.0513}{10^{-4}}\approx 513$. Konspirasjonen kan ha **høyst ca. 513 medlemmer**.
        rubric:
          - [3, '(i) $S(6)\approx 0.49$ og $S(25)\approx 0.96$']
          - [4, '(ii) Setter opp $e^{-Npt}\le 1/2$, løser til $t=\ln2/(Np)$, og får ca. 433 og 5.8 år']
          - [3, '(iii) $N\le -\ln(0.95)/(25p)\approx 513$']

      - id: O3-7c
        label: Oblig 3a, 7(c)
        type: langsvar
        points: 10
        topics: [andel, diskrete]
        prompt: |
          Sannsynligheten $p$ estimeres fra en populasjon med $n=5\,000\,000$ individer, der hvert individ følges i ett år.

          **(i)** La $X$ = antall lekkasjer. Argumenter for at $X\sim\text{Bin}(n,p)$. Hvilke antakelser gjør du?

          **(ii)** Dersom $X=20$: beregn $\hat p$ og et 95 % konfidensintervall for $p$,
          $$\hat p\pm z_{\alpha/2}\sqrt{\frac{\hat p\hat q}{n}},\qquad \hat q=1-\hat p,\quad z_{0.025}=1.96.$$

          **(iii)** Sett nedre og øvre grense inn i $e^{-Npt}$ for den store gruppen med $N=30\,000$ og $t=6$ fra (b). Hvilket intervall for $S(6)$ får du?

          **(iv)** Gi en tolkning av dette intervallet.
        solution: |
          **(i)** Hvert individ er et forsøk med to utfall (lekker / lekker ikke). Vi antar at
          - det er et fast antall forsøk, $n$,
          - sannsynligheten $p$ er den samme for alle,
          - individene er uavhengige.

          Da er antall «suksesser» $X\sim\text{Bin}(n,p)$. (Uavhengighet og lik $p$ for alle er de kritiske antakelsene.)

          **(ii)** $\hat p = 20/5\,000\,000 = 4\cdot10^{-6}$, og
          $$\sqrt{\frac{\hat p(1-\hat p)}{n}}=\sqrt{\frac{4\cdot10^{-6}}{5\cdot10^{6}}}\approx 8.94\cdot10^{-7}.$$
          Intervallet blir $4\cdot10^{-6}\pm1.96\cdot 8.94\cdot10^{-7} = [2.25\cdot10^{-6},\ 5.75\cdot10^{-6}]$.

          **(iii)** $S(6)=e^{-30000\cdot 6\cdot p}=e^{-180000\,p}$ er *avtakende* i $p$. Øvre grense for $p$ gir derfor nedre grense for $S$:
          $$e^{-180000\cdot5.75\cdot10^{-6}}\approx 0.355,\qquad e^{-180000\cdot2.25\cdot10^{-6}}\approx 0.667.$$
          Intervallet for $S(6)$ er $[0.36,\ 0.67]$.

          **(iv)** Usikkerheten i estimatet av $p$ gir stor usikkerhet i $S(6)$: sannsynligheten for at en gruppe på 30 000 holder tett i 6 år ligger et sted mellom ca. 36 % og 67 %. Fordi transformasjonen er monoton, har intervallet (omtrent) samme 95 % dekningsgrad som intervallet for $p$, gitt at modellen stemmer.
        rubric:
          - [2, '(i) Binomiske forutsetninger: fast $n$, to utfall, lik $p$, uavhengighet']
          - [3, '(ii) $\hat p=4\cdot10^{-6}$ og KI ca. $[2.25,\ 5.75]\cdot10^{-6}$']
          - [3, '(iii) Setter grensene inn i riktig rekkefølge (avtakende) og får ca. $[0.36,\ 0.67]$']
          - [2, '(iv) Fornuftig tolkning: stor usikkerhet, overført dekningsgrad']

  - title: 'Variant A · Produkthemmeligheten'
    intro: |
      Et teknologiselskap skal lansere et nytt produkt og vil holde det hemmelig så lenge som mulig. $N=250$ ansatte kjenner til produktet. Anta at hver ansatt, uavhengig av de andre, lekker informasjon i løpet av en måned med sannsynlighet $p=0.002$, og at ulike måneder er uavhengige.
    tasks:
      - id: A1a
        label: A(a)
        type: langsvar
        points: 5
        topics: [sannsynlighet]
        prompt: |
          Finn sannsynligheten for at det ikke skjer noen lekkasje i løpet av den første måneden. Finn også sannsynligheten $S(6)$ for at hemmeligheten holder i et halvt år (6 måneder), både eksakt og med tilnærmingen $e^{-Npt}$.
        solution: |
          Ved uavhengighet: $P(\text{ingen lekkasje i en måned})=(1-p)^N=0.998^{250}\approx 0.606$.

          Månedene er uavhengige, så $S(6)=(1-p)^{6N}=0.998^{1500}\approx 0.0496$. Tilnærmingen gir $e^{-Npt}=e^{-250\cdot0.002\cdot6}=e^{-3}\approx 0.0498$, nesten likt.

          Det er altså bare ca. 5 % sjanse for at hemmeligheten holder et halvt år.
        rubric:
          - [2, '$(1-p)^N\approx 0.606$ med begrunnelse (uavhengighet)']
          - [2, '$S(6)=(1-p)^{6N}\approx 0.050$']
          - [1, 'Tilnærming $e^{-3}\approx 0.050$']

      - id: A1b
        label: A(b)
        type: langsvar
        points: 5
        topics: [diskrete, poisson-eksp]
        prompt: |
          La $X$ være antall ansatte som lekker i løpet av én bestemt måned. Hvilken fordeling har $X$? Finn $E(X)$ og $V(X)$. Begrunn at $X$ er tilnærmet Poissonfordelt, og beregn $P(X\ge 2)$ både eksakt og med Poisson-tilnærmingen.
        solution: |
          Det er 250 uavhengige ansatte, og hver lekker med sannsynlighet $0.002$. Da er $X\sim\text{Bin}(250,\ 0.002)$, med
          $$E(X)=np=0.5,\qquad V(X)=np(1-p)=0.499.$$
          Fordi $n$ er stor og $p$ liten, er $X$ tilnærmet Poisson$(\lambda=np=0.5)$. Det ser vi også av at $E(X)\approx V(X)$.

          - Eksakt: $P(X\ge2)=1-0.998^{250}-250\cdot0.002\cdot0.998^{249}\approx 1-0.6062-0.3037=0.0900$
          - Poisson: $P(X\ge2)=1-e^{-0.5}(1+0.5)=1-0.6065\cdot1.5\approx 0.0902$
        rubric:
          - [2, 'Binomisk med $n=250$, $p=0.002$; $E=0.5$, $V=0.499$']
          - [1, 'Begrunner Poisson-tilnærming ($n$ stor, $p$ liten, $\lambda=np$)']
          - [2, '$P(X\ge2)\approx 0.090$ med begge metoder']

      - id: A1c
        label: A(c)
        type: langsvar
        points: 5
        topics: [sannsynlighet]
        prompt: |
          Hvor mange ansatte kan selskapet *høyst* fortelle om produktet hvis de vil at sannsynligheten for at hemmeligheten holder i 6 måneder skal være minst $0.80$? (Fortsatt $p=0.002$ per person per måned.)
        solution: |
          Vi trenger $(1-p)^{6N}\ge 0.80$. Tar logaritmen (husk at $\ln(1-p)<0$, så ulikheten snur):
          $$6N\ln(0.998)\ge \ln 0.80\ \Longrightarrow\ N\le \frac{\ln 0.80}{6\ln 0.998}=\frac{-0.2231}{-0.01201}\approx 18.6.$$
          (Med tilnærmingen: $N\le -\ln0.8/(6p)\approx 18.6$.) Siden $N$ er et heltall, kan selskapet fortelle det til **høyst 18 ansatte**.
        rubric:
          - [2, 'Setter opp $(1-p)^{6N}\ge 0.8$ eller $e^{-6Np}\ge 0.8$']
          - [2, 'Løser riktig, med riktig retning på ulikheten']
          - [1, 'Svar: høyst 18 ansatte (rundet ned)']

      - id: A1d
        label: A(d)
        type: langsvar
        points: 5
        topics: [andel, ki-test]
        prompt: |
          Selskapet vil sjekke om $p=0.002$ er for pessimistisk. Fra en bransjeundersøkelse har man data for $n=40\,000$ person-måneder, med $x=60$ lekkasjer totalt. Anta at person-månedene er uavhengige med samme $p$.

          Lag et 95 % konfidensintervall for $p$, og test $H_0: p=0.002$ mot $H_1: p<0.002$ på 5 % nivå.
        solution: |
          $\hat p = 60/40000=0.0015$. Standardfeilen er $\sqrt{\hat p(1-\hat p)/n}=\sqrt{0.0015\cdot0.9985/40000}\approx 1.94\cdot10^{-4}$, så
          $$\text{95 \% KI: } 0.0015\pm1.96\cdot1.94\cdot10^{-4}=[0.00112,\ 0.00188].$$
          **Test:** Under $H_0$ er
          $$Z=\frac{\hat p-p_0}{\sqrt{p_0(1-p_0)/n}}=\frac{0.0015-0.002}{\sqrt{0.002\cdot0.998/40000}}=\frac{-0.0005}{2.234\cdot10^{-4}}\approx -2.24.$$
          Vi forkaster når $Z\le -z_{0.05}=-1.645$. Siden $-2.24<-1.645$, **forkaster vi $H_0$** (p-verdi $\approx\Phi(-2.24)=0.0125$). Dataene tyder på at $p$ er mindre enn 0.002. Normaltilnærmingen er rimelig fordi $np_0=80\ge10$.
        rubric:
          - [2, '$\hat p=0.0015$ og KI ca. $[0.0011,\ 0.0019]$']
          - [2, 'Riktig testobservator (med $p_0$ i nevneren) og $Z\approx-2.24$']
          - [1, 'Riktig konklusjon: forkast $H_0$ (p-verdi ca. 0.013)']

  - title: 'Variant B · Overraskelsesfesten'
    intro: |
      Ingrid planlegger en overraskelsesfest for en venn om $t=21$ dager. $N=30$ personer vet om festen. Anta at hver av dem, uavhengig av de andre, røper hemmeligheten for venn en gitt dag med sannsynlighet $p=0.004$, og at ulike dager er uavhengige.
    tasks:
      - id: B1a
        label: B(a)
        type: langsvar
        points: 5
        topics: [sannsynlighet]
        prompt: |
          Finn sannsynligheten for at overraskelsen holder helt frem til festen. Bruk både eksakt formel og tilnærmingen $e^{-Npt}$. Kommenter svaret.
        solution: |
          $$S(21)=(1-p)^{Nt}=0.996^{630}\approx 0.080,\qquad e^{-Npt}=e^{-30\cdot0.004\cdot21}=e^{-2.52}\approx 0.080.$$
          Det er bare ca. 8 % sjanse for at overraskelsen holder. Selv om hver person nesten aldri røper noe på en bestemt dag (0.4 %), blir det $30\cdot21=630$ «person-dager», og da er det svært sannsynlig at minst én av dem gir lekkasje.
        rubric:
          - [3, '$S(21)\approx 0.080$ med begge metoder']
          - [2, 'Kommentar: mange person-dager gjør lekkasje sannsynlig']

      - id: B1b
        label: B(b)
        type: langsvar
        points: 6
        topics: [poisson-eksp]
        prompt: |
          La $T$ være tiden (i dager) til den første lekkasjen. Bruk at $P(T>t)=S(t)\approx e^{-Npt}$ til å argumentere for at $T$ er tilnærmet eksponentialfordelt. Hva er parameteren? Finn forventet tid og median tid til første lekkasje.

          Anta at det ikke har vært noen lekkasje de første 7 dagene. Hva er da sannsynligheten for at overraskelsen holder de resterende 14 dagene?
        solution: |
          $P(T\le t)=1-e^{-Npt}=1-e^{-\lambda t}$ er den kumulative fordelingsfunksjonen til en eksponentialfordeling med
          $$\lambda = Np = 30\cdot0.004=0.12\ \text{per dag}.$$
          - Forventning: $E(T)=1/\lambda\approx 8.3$ dager
          - Median $m$: $e^{-\lambda m}=1/2$, så $m=\ln2/\lambda\approx 5.8$ dager. Medianen er mindre enn forventningen fordi fordelingen er høyreskjev.

          **Hukommelsesløshet:** $P(T>21\mid T>7)=P(T>14)=e^{-0.12\cdot14}\approx 0.186$. Det at ingen har røpet noe den første uken, endrer ikke sjansene fremover. (Eksakt: $0.996^{420}\approx 0.186$.)
        rubric:
          - [2, 'Kjenner igjen $1-e^{-\lambda t}$ som eksponential CDF, $\lambda=Np=0.12$']
          - [2, '$E(T)\approx 8.3$ og median $\approx 5.8$ dager']
          - [2, 'Bruker hukommelsesløshet: $P(T>14)\approx 0.19$']

      - id: B1c
        label: B(c)
        type: langsvar
        points: 4
        topics: [sannsynlighet]
        prompt: |
          Hvor liten må $p$ (per person per dag) være for at sannsynligheten for at overraskelsen holder, skal være minst $1/2$? Diskuter kort om antakelsene i modellen er rimelige for denne situasjonen.
        solution: |
          Vi trenger $e^{-Np\cdot21}\ge \tfrac12$, altså
          $$p\le \frac{\ln 2}{30\cdot21}\approx 0.0011\ \text{per person per dag}.$$
          **Antakelser:** Modellen antar samme $p$ for alle og alle dager, og uavhengighet. Det er nok urealistisk:
          - Sannsynligheten øker trolig nær festen, når det planlegges mer.
          - Noen personer er mer «lekke» enn andre.
          - Folk snakker med hverandre, så lekkasjer er ikke uavhengige.
        rubric:
          - [2, '$p\le \ln2/630\approx 0.0011$']
          - [2, 'Diskuterer minst to antakelser (konstant $p$, uavhengighet, lik $p$ for alle)']

  - title: 'Variant C · Estimering av p fra avslørte saker (MLE)'
    intro: |
      Vi ser på en modell der tiden $T$ (i år) til første lekkasje i en gruppe med $N$ personer er eksponentialfordelt med parameter $\lambda=Np$, slik at $P(T>t)=e^{-Npt}$.

      En forsker har samlet data om $n=8$ (oppdiktede) skandaler der man kjenner antall involverte $N_i$ og tiden $t_i$ fra skandalen startet til første lekkasje, $i=1,\dots,8$. Tidene antas uavhengige, og $T_i\sim\exp(N_ip)$ med samme ukjente $p$ for alle. Det oppgis at $\sum_{i=1}^8 N_it_i=160\,000$.
    tasks:
      - id: C1a
        label: C(a)
        type: langsvar
        points: 4
        topics: [kontinuerlig, poisson-eksp]
        prompt: |
          Finn sannsynlighetstettheten $f(t)$ til $T$ ut fra $P(T>t)=e^{-Npt}$, og vis at $E(T)=1/(Np)$.
        solution: |
          $F(t)=P(T\le t)=1-e^{-Npt}$ for $t\ge0$, så
          $$f(t)=F'(t)=Np\,e^{-Npt},\quad t\ge 0.$$
          Dette er en eksponentialtetthet med $\lambda=Np$. Forventningen er
          $$E(T)=\int_0^\infty t\,Np\,e^{-Npt}\,dt=\frac{1}{Np},$$
          enten ved delvis integrasjon eller direkte fra formelarket ($E=1/\lambda$).
        rubric:
          - [2, 'Deriverer CDF og får $f(t)=Npe^{-Npt}$']
          - [2, '$E(T)=1/(Np)$ med begrunnelse']

      - id: C1b
        label: C(b)
        type: langsvar
        points: 8
        topics: [mle]
        prompt: |
          Finn sannsynlighetsmaksimeringsestimatoren (MLE) $\hat p$ for $p$ basert på $t_1,\dots,t_8$ og $N_1,\dots,N_8$. Ta med mellomregning, og beregn verdien av $\hat p$.
        solution: |
          **Likelihood** (uavhengighet):
          $$L(p)=\prod_{i=1}^n N_ip\,e^{-N_ipt_i}=\Big(\prod_{i=1}^n N_i\Big)\,p^n\,e^{-p\sum_i N_it_i}.$$
          **Log-likelihood:**
          $$\ell(p)=\sum_{i=1}^n\ln N_i + n\ln p - p\sum_{i=1}^n N_it_i.$$
          **Deriver og sett lik 0:**
          $$\ell'(p)=\frac{n}{p}-\sum_{i=1}^n N_it_i=0\quad\Longrightarrow\quad \hat p=\frac{n}{\sum_{i=1}^n N_it_i}.$$
          ($\ell''(p)=-n/p^2<0$, så det er et maksimum.)

          Med tall: $\hat p=8/160\,000=5\cdot10^{-5}$ per person per år.

          *(Samme struktur som H25 oppg. 2b, der $E(T)=\mu/z$.)*
        rubric:
          - [2, 'Riktig likelihood som produkt av tettheter']
          - [2, 'Riktig log-likelihood']
          - [3, 'Deriverer, setter lik 0 og får $\hat p=n/\sum N_it_i$']
          - [1, '$\hat p=5\cdot10^{-5}$']

      - id: C1c
        label: C(c)
        type: langsvar
        points: 3
        topics: [poisson-eksp]
        prompt: |
          Bruk $\hat p$ fra (b) til å anslå forventet tid til første lekkasje for en ny skandale med $N=1000$ involverte, og sannsynligheten for at den holder i minst 10 år.
        solution: |
          $\hat\lambda = N\hat p = 1000\cdot5\cdot10^{-5}=0.05$ per år, så $\widehat{E(T)}=1/0.05=20$ år og
          $$\hat P(T>10)=e^{-0.05\cdot10}=e^{-0.5}\approx 0.61.$$
        rubric:
          - [1, '$\hat\lambda=0.05$ per år']
          - [1, 'Forventet tid 20 år']
          - [1, '$P(T>10)\approx 0.61$']

  - title: Flervalg om lekkasjemodellen
    intro: |
      I alle oppgavene: $N$ personer kjenner en hemmelighet. Hver lekker uavhengig med sannsynlighet $p$ per år, og ulike år er uavhengige. $S(t)$ er sannsynligheten for at hemmeligheten holder i $t$ år.
    tasks:
      - id: F1
        label: F1
        type: flervalg
        points: 6
        topics: [sannsynlighet]
        prompt: |
          Hvilke utsagn er korrekte?
        options:
          - text: '$S(t)=(1-p)^{Nt}$'
            correct: true
            why: '$Nt$ uavhengige person-år, og hvert må være uten lekkasje.'
          - text: 'Sannsynligheten for minst én lekkasje innen $t$ år er $1-S(t)$'
            correct: true
            why: 'Komplementet til «ingen lekkasje».'
          - text: '$S(t)=1-Npt$ eksakt'
            why: 'Dette er bare en førsteordens tilnærming, og den kan bli negativ. Riktig tilnærming er $e^{-Npt}$.'
          - text: 'Dobler vi $N$ og halverer $t$, er $S(t)$ uendret'
            correct: true
            why: '$S$ avhenger bare av produktet $Nt$.'
          - text: 'Sannsynligheten for minst én lekkasje innen $t$ år er $Npt$ eksakt'
            why: 'Det ville gitt sannsynligheter over 1 for store $N$. Riktig er $1-(1-p)^{Nt}$.'

      - id: F2
        label: F2
        type: flervalg
        points: 6
        topics: [diskrete, poisson-eksp]
        prompt: |
          La $N=30\,000$ og $p=4\cdot10^{-6}$, og la $X$ være antall personer som lekker i løpet av ett bestemt år. Hvilke utsagn er korrekte?
        options:
          - text: '$X\sim\text{Bin}(30000,\ 4\cdot10^{-6})$'
            correct: true
          - text: '$E(X)=0.12$'
            correct: true
            why: '$np=30000\cdot4\cdot10^{-6}=0.12$.'
          - text: '$X$ er tilnærmet Poissonfordelt med $\lambda=0.12$'
            correct: true
            why: '$n$ stor, $p$ liten, $\lambda=np$.'
          - text: '$P(X\ge1)\approx 0.12$'
            why: '$P(X\ge1)=1-e^{-0.12}\approx 0.113$. Forventningen og sannsynligheten for minst én er ikke det samme.'
          - text: '$X$ er tilnærmet normalfordelt fordi $n$ er stor'
            why: 'Normaltilnærmingen krever $np\ge10$. Her er $np=0.12$.'

      - id: F3
        label: F3
        type: flervalg
        points: 6
        topics: [andel]
        prompt: |
          Vi følger $n=5\,000\,000$ personer i ett år og observerer $x=20$ lekkasjer. Vi bruker $\hat p\pm 1.96\sqrt{\hat p(1-\hat p)/n}$. Hvilke utsagn er korrekte?
        options:
          - text: '$\hat p=4\cdot10^{-6}$'
            correct: true
          - text: 'Et 95 % konfidensintervall er ca. $[2.2\cdot10^{-6},\ 5.8\cdot10^{-6}]$'
            correct: true
            why: 'Standardfeil $\approx 8.9\cdot10^{-7}$, og $1.96\cdot 8.9\cdot10^{-7}\approx1.75\cdot10^{-6}$.'
          - text: 'Et 95 % konfidensintervall er ca. $[3.1\cdot10^{-6},\ 4.9\cdot10^{-6}]$'
            why: 'Dette er $\hat p\pm$ én standardfeil (ca. 68 %).'
          - text: 'Den øvre grensen for $p$ gir den øvre grensen for $S(6)=e^{-6Np}$'
            why: '$S$ er avtakende i $p$, så øvre grense for $p$ gir *nedre* grense for $S$.'
          - text: 'Det er 95 % sannsynlighet for at akkurat dette intervallet inneholder $p$'
            why: 'Feil tolkning. 95 % gjelder metoden ved gjentatte utvalg. Når intervallet er regnet ut, enten inneholder det $p$ eller ikke.'

      - id: F4
        label: F4
        type: flervalg
        points: 6
        topics: [sannsynlighet]
        prompt: |
          Grimes (2016) anslår $p\approx4\cdot10^{-6}$ per person per år. Hvilke utsagn passer med sannsynlighetsbegrepet i STAT110?
        options:
          - text: 'Over svært mange person-år forventer vi at andelen med lekkasje nærmer seg $p$'
            correct: true
            why: 'Frekvenstolkningen, jf. store talls lov.'
          - text: 'Utfallsrommet for «én person i ett år» kan skrives $\{\text{lekker},\ \text{lekker ikke}\}$'
            correct: true
          - text: '$p$ er sannsynligheten for at konspirasjonen blir avslørt i løpet av et år'
            why: '$p$ er per person, og lekkasje er ikke det samme som avsløring.'
          - text: 'Fordi $p$ er så liten, er det svært usannsynlig at en gruppe på 30 000 lekker innen 6 år'
            why: '$1-S(6)=1-e^{-0.72}\approx 0.51$. Det er mer sannsynlig enn ikke.'
