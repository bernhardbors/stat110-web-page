id: v24
title: Eksamen vår 2024
short: V24
kind: tidligere
order: 4
blurb: Fire langsvar på 10 p (sannsynlighetstabell, binomisk, simultantetthet, store talls lov) og fem flervalg.
duration_min: 240
note: |
  Oppgavetekstene er fra eksamen i STAT110 våren 2024 (UiB). Løsningsforslag og poengmal er våre egne, basert på det offisielle løsningsforslaget.

sections:
  - title: Forsikring
    intro: |
      Et forsikringsselskap tilbyr fire nivåer på egenandel for husforsikring: ingen (N), lav (L), medium (M) og høy (H). For bilforsikring tilbys tre nivåer: lav (L), medium (M) og høy (H). Tabellen viser andelen forsikringstakere for hver kombinasjon, blant kundene som har begge forsikringstypene. For eksempel har 6 % lav egenandel både på hus og bil.

      | Bil \ Hus | N | L | M | H |
      |---|---|---|---|---|
      | L | .04 | .06 | .05 | .03 |
      | M | .07 | .10 | .20 | .10 |
      | H | .02 | .03 | .15 | .15 |

      Vi ser på en tilfeldig valgt slik forsikringstaker.
    tasks:
      - id: '1'
        label: '1'
        type: langsvar
        points: 10
        topics: [simultan, sannsynlighet]
        prompt: |
          Hva er sannsynligheten for at hen har lav egenandel på bil? Hva er sannsynligheten for at hen har forskjellig nivå for bil og hus? Hva er sannsynligheten for at hen har minst én forsikring med egenandel på nivå «lav»?
        solution: |
          **Lav på bil** (summen av raden): $0.04+0.06+0.05+0.03=0.18$.

          **Forskjellig nivå:** Samme nivå er bare mulig for L, M og H (huset har også N), altså cellene (L,L), (M,M) og (H,H):
          $$1-(0.06+0.20+0.15)=0.59.$$
          **Minst én «lav»:** Addisjonssetningen, med $P(\text{lav hus})=0.06+0.10+0.03=0.19$ (kolonnen):
          $$P(\text{lav bil}\cup\text{lav hus})=0.18+0.19-0.06=0.31.$$
        rubric:
          - [3, 'Lav på bil: radsum $0.18$']
          - [3, 'Forskjellig nivå via komplementet: $0.59$']
          - [4, 'Minst én lav med addisjonssetningen: $0.31$']

  - title: Binomisk fordeling
    intro: |
      La $X$ og $Y$ være uavhengige og begge binomisk fordelt med $n=10$ forsøk og suksessannsynlighet $p=0.3$.
    tasks:
      - id: '2'
        label: '2'
        type: langsvar
        points: 10
        topics: [diskrete]
        prompt: |
          Hva er $P(X<4)$? Hvilken fordeling har $Z=X+Y$? Begrunn svaret.
        solution: |
          $X$ er heltallig, så $P(X<4)=P(X\le3)=B(3;10,0.3)=0.650$ (tabell A.1).

          $Z=X+Y\sim\text{Bin}(20,\ 0.3)$. Til sammen er det $10+10=20$ uavhengige forsøk, alle med samme suksessannsynlighet $0.3$, så betingelsene for en binomisk situasjon er oppfylt. (Alternativt følger det av addisjonsregelen på formelarket.)
        rubric:
          - [2, 'Skriver om $P(X<4)=P(X\le3)$']
          - [3, 'Riktig tabellverdi $0.650$']
          - [3, '$Z\sim\text{Bin}(20,\ 0.3)$']
          - [2, 'Begrunnelse: 20 uavhengige forsøk med samme $p$']

  - title: Levetider
    intro: |
      La $X$ og $Y$ være levetider med simultan tetthet
      $$f(x,y)=xe^{-x(1+y)},\qquad x,y\ge0.$$
      Du får opplyst at den betingede tettheten til $X$ gitt $Y=y$ er $f(x\mid y)=xe^{-x(1+y)}(1+y)^2$ for $x,y\ge0$.
    tasks:
      - id: '3'
        label: '3'
        type: langsvar
        points: 10
        topics: [kontinuerlig]
        prompt: |
          Hva er marginaltettheten til $X$, dvs. $f_X(x)$? Hva er marginaltettheten til $Y$?
        solution: |
          **$f_X$:** Integrer ut $y$:
          $$f_X(x)=\int_0^\infty xe^{-x(1+y)}\,dy=xe^{-x}\int_0^\infty e^{-xy}\,dy=xe^{-x}\cdot\frac1x=e^{-x},\quad x\ge0.$$
          $X$ er altså eksponentialfordelt med $\lambda=1$.

          **$f_Y$:** Integralet over $x$ krever delvis integrasjon. Det er enklere å bruke definisjonen av betinget tetthet, $f(x\mid y)=f(x,y)/f_Y(y)$:
          $$f_Y(y)=\frac{f(x,y)}{f(x\mid y)}=\frac{xe^{-x(1+y)}}{xe^{-x(1+y)}(1+y)^2}=(1+y)^{-2},\quad y\ge0.$$
          (Kontroll: $\int_0^\infty(1+y)^{-2}dy=1$.)
        rubric:
          - [5, '$f_X(x)=e^{-x}$ med riktig integrasjon over $y$']
          - [5, '$f_Y(y)=(1+y)^{-2}$, via $f(x,y)/f(x\mid y)$ eller ved integrasjon']

  - title: Store talls lov
    tasks:
      - id: '4'
        label: '4'
        type: langsvar
        points: 10
        topics: [sgt]
        prompt: |
          Beskriv kort med ord hva store talls lov er, og gi et eksempel på bruk av den som involverer eksponentialfordelingen.
        solution: |
          **Store talls lov:** For uavhengige og likt fordelte $X_1,X_2,\dots$ med forventning $E(X)$ vil gjennomsnittet $\bar X_n=\frac1n(X_1+\cdots+X_n)$ gå mot $E(X)$ når $n\to\infty$. Det mer presise er at konvergensen skjer med sannsynlighet 1, men det kreves ikke her.

          **Eksempel:** Har $X$ tetthet $f(x)=\lambda e^{-\lambda x}$, er $E(X)=1/\lambda$. Store talls lov gir da $\bar X_n\to1/\lambda$. Gjennomsnittlig ventetid mellom bussene over mange dager nærmer seg den teoretiske forventede ventetiden. Det betyr også at $1/\bar X_n$ er et fornuftig estimat av $\lambda$.
        rubric:
          - [5, 'Riktig formulering: gjennomsnittet går mot forventningen når $n\to\infty$ (i.i.d.)']
          - [5, 'Eksempel med eksponentialfordeling: $\bar X\to1/\lambda$']

  - title: Flervalg
    tasks:
      - id: 5a
        label: Q8
        type: flervalg
        points: 6
        topics: [ki-test]
        prompt: |
          Du har konstruert konfidensintervallet $\bar x\pm1.96\,\frac{\sigma}{\sqrt n}=[4.1,\ 4.4]$ for $\mu$ basert på $N(\mu,\sigma^2)$-fordelte observasjoner med $\sigma$ kjent. Hvilke utsagn er korrekte?
        options:
          - text: 'Dette er et 90 % konfidensintervall'
            why: '$1.96=z_{0.025}$ gir et 95 %-intervall. 90 % ville brukt $1.645$.'
          - text: 'Dersom vi i stedet hadde laget et $t$-intervall $\big(\bar x\pm t\,\frac{s}{\sqrt n}\big)$, er det mulig at det ville blitt smalere enn vårt intervall'
            correct: true
            why: 'Hvis $s$ tilfeldigvis er en god del mindre enn $\sigma$, kan $t\cdot s$ bli mindre enn $1.96\,\sigma$.'
          - text: 'Ut fra opplysningene kan vi konkludere at $\bar x=4.30$'
            why: '$\bar x$ er midtpunktet: $(4.1+4.4)/2=4.25$.'

      - id: 5b
        label: Q9
        type: flervalg
        points: 6
        topics: [andel, ki-test]
        prompt: |
          I partikkelakseleratoren ved CERN ser man noen ganger at Higgs-bosonet splittes i to $\gamma$-partikler. La $q$ være sannsynligheten for at det skjer. Standardmodellen predikerer $q=2.28\times10^{-3}$. I et forsøk observerer vi at 32 av 10 000 Higgs-bosoner splittes i to (ikke ekte data). Spørsmålet er om dataene gir grunnlag for å tvile på Standardmodellen. Vi tester $H_0:q=2.28\times10^{-3}$ mot $H_a:q\ne2.28\times10^{-3}$. Du kan anta uavhengighet mellom ulike Higgs-bosoner.

          Hvilke utsagn er korrekte?
        options:
          - text: 'Dette er en binomisk situasjon med $n=10000$ og suksessannsynlighet $q=2.28\times10^{-3}$ hvis Standardmodellen holder'
            correct: true
          - text: 'p-verdien for testen er (tilnærmet) $2\cdot P\!\left(Z>\dfrac{32/n-q_0}{\sqrt{q_0(1-q_0)/n}}\right)$, der $n=10000$, $q_0=2.28\times10^{-3}$ og $Z$ er standard normalfordelt'
            correct: true
            why: 'Tosidig test. Observatoren er $z\approx1.93$, så $p\approx0.054$.'
          - text: 'Basert på 95 %-konfidensintervallet $[0.0021,\ 0.0043]$ for $q$ vil du ikke forkaste $H_0$'
            correct: true
            why: '$q_0=0.00228$ ligger inne i intervallet.'

      - id: 5c
        label: Q1
        type: flervalg
        points: 6
        topics: [beskrivende]
        prompt: |
          La $\bar x_n$ og $s_n^2$ være gjennomsnitt og empirisk varians for utvalget $x_1,\dots,x_n$, og la $\bar x_{n+1}$ og $s^2_{n+1}$ være de samme størrelsene når vi utvider utvalget med én ny observasjon $x_{n+1}$. Oppdateringsformelen for variansen er
          $$s_{n+1}^2=\frac{n-1}{n}s_n^2+\frac{(x_{n+1}-\bar x_n)^2}{n+1},\quad n\ge1,\qquad s_1=0.$$
          Hvilke utsagn er korrekte (generelt)?
        options:
          - text: '$\bar x_{n+1}=(n\bar x_n+x_{n+1})/(n+1)$, $n\ge1$'
            correct: true
            why: 'Summen av de $n$ første er $n\bar x_n$.'
          - text: '$\bar x_n=((n-1)\bar x_{n-1}+x_n)/n$, $n\ge2$'
            correct: true
            why: 'Samme formel med indeksen flyttet ett steg.'
          - text: '$s_2^2=(x_2-x_1)^2/2$'
            correct: true
            why: 'Sett $n=1$ i oppdateringsformelen: $0+(x_2-x_1)^2/2$.'
          - text: '$s_{n+1}^2\ge s_n^2$, $n\ge1$'
            why: 'Ligger den nye observasjonen nær gjennomsnittet, synker variansen (faktoren $\frac{n-1}{n}<1$).'

      - id: 5d
        label: Q7
        type: flervalg
        points: 6
        topics: [mle]
        prompt: |
          La $X$ ha tetthet $f_\theta(x)=\theta e^{-\theta x}$, $x\ge0$, der $\theta\ge0$ er en parameter. Gitt $n$ uavhengige slike observasjoner $x_1,\dots,x_n$ vil vi finne likelihoodfunksjonen $L(\theta)$ og log-likelihood $l(\theta)$. Hvilke utsagn er korrekte?
        options:
          - text: '$L(\theta)=\sum_{i=1}^n\theta e^{-\theta x_i}$'
            why: 'Likelihood er et *produkt*, ikke en sum.'
          - text: '$l(\theta)=-\theta\sum_{i=1}^nx_i$'
            why: 'Mangler leddet $n\ln\theta$.'
          - text: '$l(\theta)=-\theta^n\sum_{i=1}^nx_i$'
          - text: '$L(\theta)=\theta^ne^{-\theta\sum_{i=1}^nx_i}$'
            correct: true
            why: 'Produktet av $n$ tettheter. Da er $l(\theta)=n\ln\theta-\theta\sum x_i$ og $\hat\theta=1/\bar x$.'

      - id: 5e
        label: Q5
        type: flervalg
        points: 6
        topics: [kovarians]
        prompt: |
          La $X$ og $Y$ være tilfeldige variabler, la $Cov(\cdot,\cdot)$ være kovariansfunksjonen og $V(\cdot)$ variansen. Hvilke utsagn er korrekte?
        options:
          - text: '$Cov(X+2,\ 3-Y)=-2\cdot3\cdot Cov(X,Y)$'
            why: 'Konstanter forsvinner: $Cov(X+2,3-Y)=-Cov(X,Y)$.'
          - text: '$Cov(X+Y,\ X)=V(X)+Cov(Y,X)$'
            correct: true
          - text: '$Cov(X+Y,\ X)=V(X)+Cov(X,Y)$'
            correct: true
            why: 'Kovarians er symmetrisk.'
          - text: '$Cov(Y,\ 2Y)=2^2V(Y)$'
            why: '$Cov(Y,2Y)=2\,Cov(Y,Y)=2V(Y)$.'
          - text: '$Cov(X,Y)\le\sqrt{V(X)\cdot V(Y)}$'
            correct: true
            why: 'Fordi korrelasjonen er høyst 1.'
