title: Hele pensum i STAT110
intro: |
  En oversikt over hele pensum, ordnet etter kapitlene i Devore, Berk & Carlton (kap. 1–9, se pensumlisten). Hver seksjon har definisjoner, formler og fremgangsmåter, med eksamenstips der det er nyttig, og lenker til eksamensoppgaver du kan øve på.

  Boksene betyr:

  :::ide
  Det viktigste å forstå.
  :::

  :::metode
  Oppskrift steg for steg, slik du bør føre det på eksamen.
  :::

  :::pass
  Vanlige feil.
  :::

  :::eksamen
  Hvordan temaet har dukket opp på tidligere eksamener.
  :::

  Merk seksjoner som lest etter hvert. Studieradaren på forsiden viser hva du har lest.
